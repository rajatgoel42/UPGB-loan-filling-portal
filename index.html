<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Application Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <a href="https://github.com/rajatgoel42/"></a>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Loan Application Form</h1>
        
        <form id="loanForm">
            <div class="form-group mb-3">
                <label for="fullName">Full Name</label>
                <input type="text" class="form-control" id="fullName" required>
            </div>
            
            <div class="form-group mb-3">
                <label for="dob">Date of Birth</label>
                <input type="date" class="form-control" id="dob" required>
            </div>

            <div class="form-group mb-3">
                <label for="address">Address</label>
                <input type="text" class="form-control" id="address" required>
            </div>

            <div class="form-group mb-3">
                <label for="loanAmount">Loan Amount</label>
                <input type="number" class="form-control" id="loanAmount" required>
            </div>

            <div class="form-group mb-3">
                <label for="loanTerm">Loan Term (Months)</label>
                <input type="number" class="form-control" id="loanTerm" required>
            </div>

            <div class="form-group mb-3">
                <label for="interestRate">Interest Rate (%)</label>
                <input type="number" class="form-control" id="interestRate" required>
            </div>

            <div class="form-group mb-3">
                <label for="loanPurpose">Loan Purpose</label>
                <textarea class="form-control" id="loanPurpose" rows="4" required></textarea>
            </div>

            <div class="form-group mb-3">
                <label for="terms">
                    <input type="checkbox" id="terms" required>
                    I agree to the terms and conditions.
                </label>
            </div>

            <button type="submit" class="btn btn-primary">Generate Agreement PDF</button>
        </form>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
